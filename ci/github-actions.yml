name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Ruff check
        run: ruff check arbor_guardian arbor_guardian.py
      - name: Ruff format
        run: ruff format --check arbor_guardian arbor_guardian.py
      - name: Compile
        run: python -m compileall -q arbor_guardian arbor_guardian.py
      - name: CLI smoke (--help)
        run: |
          python arbor_guardian.py --help
          python arbor_guardian.py messages --help
          python arbor_guardian.py meals --help
          python -m arbor_guardian children --help
      - name: Unit tests (stdlib)
        run: python -m unittest discover -s tests -v
